name: Check and bundle

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm run bundle
      - uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          path: build/*.zip
