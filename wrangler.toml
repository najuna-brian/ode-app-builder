# Cloudflare deploy: a Worker that only serves the static builder/ folder.
# Deploy with: npm run deploy   (needs `npx wrangler login` once)
name = "ode-app-builder"
compatibility_date = "2026-10-01"

[assets]
directory = "./builder"
not_found_handling = "404-page"

[[routes]]
pattern = "ode-app.nahati.online"
custom_domain = true
